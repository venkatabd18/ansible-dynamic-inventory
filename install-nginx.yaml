- name: install nginx
  hosts: all
  connection: local
  become: yes

  tasks:
  - name: install boto3 and botocore
    ansible.builtin.pip:
      name: "{{ item }}"
      state: present
      executable: pip3.9
    loop:
      - boto3
      - botocore

  - name: install nginx
    ansible.builtin.package:
      name: nginx

  - name: start and enable nginx
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes